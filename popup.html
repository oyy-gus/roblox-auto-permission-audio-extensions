<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Auto Permission</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Auto Permission</h1>
        <p>Roblox Creator Dashboard</p>
      </div>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">STANDBY</span>
    </div>
  </header>

  <!-- Configuration Form -->
  <section class="card">
    <div class="card-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      Pengaturan
    </div>

    <div class="form-group">
      <label for="inputUsernames">Usernames (Pisahkan dengan koma atau baris baru)</label>
      <textarea id="inputUsernames" placeholder="Contoh: TBR SOCIETY, UserLain"></textarea>
      <div class="help-text">Nama pengguna yang akan ditambahkan ke Collaborators</div>
    </div>

    <div class="form-group">
      <label for="inputUniverseId">Universe ID / Experience ID</label>
      <input type="text" id="inputUniverseId" placeholder="Contoh: 1234567890">
      <div class="help-text">ID Experience yang akan ditambahkan</div>
    </div>
  </section>

  <!-- Action Controls Grid -->
  <div class="button-grid">
    <button id="btnBoth" class="btn btn-primary">
      🚀 Start Both (Collab + Exp)
    </button>
    <button id="btnUsername" class="btn btn-secondary">
      👤 Start Username
    </button>
    <button id="btnUniverse" class="btn btn-accent">
      🎮 Start Universe
    </button>
    <button id="btnScan" class="btn btn-scan">
      🔍 Scan Only (Filter Moderated)
    </button>
    <button id="btnArchiveModerated" class="btn btn-warning" style="grid-column: span 2;">
      📦 Auto Archive Moderated Audio
    </button>
    <button id="btnStop" class="btn btn-danger">
      ⛔ Stop
    </button>
    <button id="btnReset" class="btn btn-neutral">
      🔄 Reset
    </button>
  </div>

  <!-- Progress Section -->
  <section class="card progress-card">
    <div class="progress-header">
      <span id="progressLabel">Progres: 0 / 0</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div id="progressBarFill" class="progress-bar-fill"></div>
    </div>
  </section>

  <!-- Live Logs Console -->
  <section class="card" style="padding: 10px;">
    <div class="card-title" style="margin-bottom: 6px; justify-content: space-between;">
      <span>💻 Live Logs</span>
      <button id="btnViewJson" class="btn btn-neutral" style="padding: 2px 8px; font-size: 10px;">
        📋 View JSON
      </button>
    </div>
    <div id="consoleLog" class="console-box">[AutoPerm] Siap digunakan. Filter moderasi otomatis AKTIF.</div>
  </section>

  <!-- JSON View Modal -->
  <div id="jsonModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📋 Audio List JSON</h2>
        <button id="btnCloseModal" class="modal-close">&times;</button>
      </div>
      <div style="display: flex; gap: 6px; margin-bottom: 8px;">
        <button id="btnTabCleanJson" class="btn btn-secondary" style="flex:1; padding: 4px 8px; font-size: 11px;">
          Lulus Moderasi (<span id="countClean">0</span>)
        </button>
        <button id="btnTabModeratedJson" class="btn btn-warning" style="flex:1; padding: 4px 8px; font-size: 11px;">
          Terkena Moderasi (<span id="countModerated">0</span>)
        </button>
      </div>
      <div class="modal-body">
        <textarea id="jsonOutput" readonly></textarea>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="btnCopyJson" class="btn btn-primary" style="flex:1;">Salin JSON</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
